[project]
name = "scorm-dispatch-client"
version = "0.1.0"
description = "Async Python client for the scorm-dispatch API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Daniel Alfocea", email = "me@danielalfocea.com" }]
keywords = ["scorm", "scorm-dispatch", "lms", "elearning", "httpx", "asyncio", "client"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
    "Typing :: Typed",
]
dependencies = [
    "httpx2>=2.13",
    "pydantic>=2.10",
]

[project.urls]
Homepage = "https://github.com/cr0hn/scorm-dispatch-python"
Repository = "https://github.com/cr0hn/scorm-dispatch-python"
Issues = "https://github.com/cr0hn/scorm-dispatch-python/issues"

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.0",
    "ruff>=0.15",
    "mypy>=2",
    "openapi-core>=0.19",
    "pyyaml>=6",
    "types-pyyaml",
    "testcontainers>=4.9",
    "pytest-cov>=6",
]

[build-system]
requires = ["uv_build>=0.11,<0.14"]
build-backend = "uv_build"

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
markers = ["integration: builds the Go binary and needs Docker (make python-sdk-check)"]

[tool.uv.build-backend]
module-name = "scorm_dispatch"

[tool.coverage.run]
source = ["scorm_dispatch"]
branch = true

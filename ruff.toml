line-length = 100
target-version = "py311"
src = ["src", "tests"]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF", "PT", "C4", "PL", "N", "A", "T20"]
ignore = ["PLR2004", "N818", "PLR0913", "PLR0911", "PLR0912", "PLR0915"]

[lint.per-file-ignores]
"tests/**" = ["S", "PLR", "ASYNC", "PT018"]

"**/scripts/**" = ["T20"]
"**/tools/**" = ["T20"]
